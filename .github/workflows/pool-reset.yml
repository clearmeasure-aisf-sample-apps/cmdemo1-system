# Nightly reset of every pull-request pool slot from the template (issue #656). Target under 5 minutes per slot.
# Live Azure SQL copy requires stack-cmdemo1-pool (#653) after Jeffrey's yes. Until then the job uses -DryRun.
name: pool-reset

on:
  schedule:
    - cron: "27 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and print; change no Azure state"
        type: boolean
        default: true
  repository_dispatch:
    types: [pool-reset]

permissions:
  contents: read

concurrency:
  group: pool-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Reset all pool slots (DryRun until pool stack exists)
        shell: pwsh
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || github.event_name != 'workflow_dispatch' }}
        run: |
          $dry = $env:DRY_RUN -ne 'false'
          ./scripts/pool/reset.ps1 -Action reset-all -Nightly -DryRun:$dry
