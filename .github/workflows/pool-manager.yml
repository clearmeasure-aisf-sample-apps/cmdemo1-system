# Pool manager (issue #656): sweeper + warm/cool on the schedule in system.json pool.warm.
# Runs every 5 minutes and on dispatch. Decision rules are tested by scripts/test-pool-manager.ps1 in env-checks.
# Live Azure lease-store / scale changes require the lease store (#652) and stack-cmdemo1-pool (#653) after Jeffrey's
# yes. Until then every job step uses -DryRun and exits 0 (no Azure write).
name: pool-manager

on:
  schedule:
    # Align with pool.warm.managerIntervalMinutes (5).
    - cron: "2/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and print; change no Azure state"
        type: boolean
        default: true
  repository_dispatch:
    types: [pool-manager]

permissions:
  contents: read
  actions: read

concurrency:
  group: pool-manager
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Sweep leaked leases (DryRun until lease store exists)
        shell: pwsh
        env:
          # Schedule / repository_dispatch stay DryRun until #652/#653. workflow_dispatch honors inputs.dry_run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || github.event_name != 'workflow_dispatch' }}
        run: |
          $dry = $env:DRY_RUN -ne 'false'
          ./scripts/pool/lease.ps1 -Action sweep -DryRun:$dry

      - name: Warm / cool slots (DryRun until pool stack exists)
        shell: pwsh
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || github.event_name != 'workflow_dispatch' }}
        run: |
          $dry = $env:DRY_RUN -ne 'false'
          ./scripts/pool/manage-warm.ps1 -Action apply -DryRun:$dry
