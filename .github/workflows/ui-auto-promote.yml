# Since 2026-11-09 (owner, Jeffrey Palermo) this workflow is again the only promoter of cmdemo1-ui to uat and prod: the
# fworker gateway's own promotion of ui (2026-10-24 to 2026-11-09) stopped at uat..master over GitHub's 250-commit compare
# limit and promoted only Auto Merge items with its FT verdict. The gateway's switch is delivery.autoPromote.enabled in
# cmdemo1-fworker's config/deploy.overrides.json (false: its delivery train only observes uat and prod); its Octopus team
# (octopus/own-fworker-ui-promoter.tf) creates ui deployments in tdd only. Started by the schedule, by hand
# (workflow_dispatch), or by another system (repository_dispatch, type ui-auto-promote, e.g. cm-ai-ops-bot); inputs
# deployable (all, ui, dashboard, system, fworker) and dry_run, in client_payload for repository_dispatch.
# Automatic promotion of releases of every active cmdemo1 Octopus deployable in Spaces-355 that this workflow covers
# (ui, dashboard, system; fworker kept from 2026-10-15), by the owner's decisions of 2026-10-14 (Jeffrey Palermo) and
# 2026-11-10 (#560): "release candidates automatically deployed to production if there is nothing to flag them. don't
# let them stop in release queue". AISF is excluded; retired scorecard and repos without an Octopus project
# (scorecard-site, video) are not added. Each run promotes in order ui, dashboard, system, fworker, one after the other
# in this one job (never two promotions to one environment at once). The per-deployable settings (application paths,
# health path, build path) are a table at the top of the script.
# scripts/auto-promote/ui-auto-promote.ps1 -Deployable <name> finds the newest release that succeeded in the previous environment (tdd before uat, uat before prod) and has no
# deployment yet to the next, one environment step per run, never while a deployment of it to uat or prod is queued,
# running or waiting. It promotes it, and answers its Sign-off as the system's service account with a reason that names
# this run, unless something flags it. The flags (every rule is a function, tested by scripts/auto-promote/test-ui-auto-promote.ps1,
# which this workflow runs first; the owner's lists of documentation paths and build files are at the top of the script):
#   1. Red build or tests: a failed check run or commit status on the release's commit in the application repository
#      (pending: the run waits and flags nothing yet).
#   2. Deployment or health failed: the deployment to the previous environment did not succeed, its task log has an
#      Error or Warning line or a step SuccessWithWarning (the rule of the kit's test-deployment-logs.ps1), or
#      its health (ui /_healthcheck/detailed overallStatus; fworker /ready: 200; dashboard / httpOk; system: no HTTP
#      health, Verify already ran) was not Healthy in a read taken since it finished (an answered non-Healthy status counts at
#      once; an unreachable or timed-out read is retried up to 3 times, 20 to 30 s apart, in the same run, and flags as
#      Unreachable only when all four attempts fail), or the task log is unreadable. Health rule, exactly: no read since the deployment finished is not
#      Healthy, at least two reads are Healthy and at least 5 minutes apart, and the later one is at least 10 minutes
#      after the deployment finished; otherwise the run waits (an address that is not known: wait, "health address
#      unknown"). Each run adds one read (two, 5 minutes apart, when the first one comes late), kept in branch
#      auto-promote (one commit, force-pushed, no history; ui-auto-promote.json: reads per deployment, two days).
#   3. Pipeline or infra change: compared with the commit running in the next environment (BuildPath: ui/fworker /_build
#      "commit"; dashboard /build-facts.json "commit"; system: release notes only), a
#      changed path outside the deployable's application paths (ui/dashboard: src/; system: environments/, infra/,
#      octopus/, scripts/, …; fworker: gateway/, plugin/, tests/,
#      config/instance.json) or a build/project file inside them (Directory.Build.*, global.json, nuget.config, *.csproj,
#      *.sln, *.props, *.targets, Dockerfile*). Never a flag: for ui src/Database/ (migrations; owner, 2026-10-14) and .github/private-build/ (the kit's script; owner, 2026-10-14); for all
#      documentation (docs/**, arch/**, *.md anywhere: proposed, one list in the script for the owner to edit). The
#      comparison is read from a clone of the application repository (no commit or file cap, unlike GitHub's compare);
#      one that is incomplete (no base commit, a read failed) flags.
#   4. Hold label: a pull request in those commits, or an issue they close or reference (also owner/repo#N), labelled
#      Hold. A read of that chain that fails or is cut makes the run wait.
# Health reads of every deployable share one state file (keys "<deployable>/<deployment id>").
# A deployment this workflow created that waits at its Sign-off (its Comments say so) is evaluated again by a later run: no
# flag, it is answered; a flag, it stays waiting and the issue says so. Any unfinished deployment or runbook run to the
# target environment, of any project, stops the run; so does a task listing that fails or is incomplete.
# A flagged release is not deployed: no Sign-off waits in the environment and holds it for the other deployables. One
# issue "<deployable> <version> held before <env>" (label release-held, no assignee) lists each flag with its evidence; it closes
# when the release has a deployment there or a newer release replaces it. A person promotes it in Octopus as today.
# Exception (owner, 2026-10-14): when flag 3 is the only flag, the release is promoted anyway 60 minutes after its deployment
# to the previous environment finished, if master of the application repository is green (pending, red or unreadable: held).
# Credentials: GitHub OIDC to Octopus as the system's service account (environment "octopus"; it must create
# deployments and answer their Sign-off as Space Manager of the space), and this workflow's token
# for issues and the state branch. The application repositories are public (or this repository for system). No stored secret.
name: ui-auto-promote

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      deployable:
        description: "Which deployable to evaluate (all: ui, dashboard, system, then fworker)"
        type: choice
        options: [all, ui, dashboard, system, fworker]
        default: all
      dry_run:
        description: "Decide and print, change nothing"
        type: boolean
        default: false
  # For a system that reacts to events (cm-ai-ops-bot): POST /repos/<this repository>/dispatches with event_type
  # ui-auto-promote and client_payload {"deployable": "ui", "dry_run": false} (both optional). Its token needs Contents: write
  # here; workflow_dispatch needs Actions: write. Either run takes the same gates and waits its turn (concurrency below).
  repository_dispatch:
    types: [ui-auto-promote]

env:
  DEPLOYABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.deployable || github.event_name == 'repository_dispatch' && github.event.client_payload.deployable || 'all' }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || github.event_name == 'repository_dispatch' && (github.event.client_payload.dry_run == true || github.event.client_payload.dry_run == 'true') }}

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: ui-auto-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: octopus
    timeout-minutes: 55
    steps:
      - name: Check the request
        run: |
          case "$DEPLOYABLE" in all|ui|dashboard|system|fworker) echo "Deployable: $DEPLOYABLE; dry run: $DRY_RUN; event: ${{ github.event_name }}" ;;
            *) echo "::error::deployable '$DEPLOYABLE' is not all, ui, dashboard, system or fworker"; exit 1 ;; esac

      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false

      - name: Test the decision rules
        id: rules
        shell: pwsh
        run: ./scripts/auto-promote/test-ui-auto-promote.ps1

      - name: Sign in to Octopus
        id: login
        uses: OctopusDeploy/login@v2
        with:
          server: ${{ vars.OCTOPUS_URL }}
          service_account_id: ${{ vars.OCTOPUS_SERVICE_ACCOUNT_ID }}

      - name: Fetch the health reads
        id: fetch
        run: |
          set -euo pipefail
          echo '{}' > "$RUNNER_TEMP/ui-auto-promote.json"
          if [ -n "$(git ls-remote --heads origin auto-promote)" ]; then
            git fetch --quiet --depth=1 origin auto-promote
            git show FETCH_HEAD:ui-auto-promote.json > "$RUNNER_TEMP/ui-auto-promote.json" || echo '{}' > "$RUNNER_TEMP/ui-auto-promote.json"
          fi

      # Each deployable's step runs whenever the rules, the sign-in and the reads succeeded and the run asks for it; never
      # when one of them failed. Later deployables also run when an earlier step failed (one promotion at a time either way).
      - name: Promote or hold ui
        if: ${{ !cancelled() && steps.rules.outcome == 'success' && steps.login.outcome == 'success' && steps.fetch.outcome == 'success' && (env.DEPLOYABLE == 'all' || env.DEPLOYABLE == 'ui') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./scripts/auto-promote/ui-auto-promote.ps1 -Deployable ui -StatePath "$env:RUNNER_TEMP/ui-auto-promote.json" -RunUrl $run -DryRun:($env:DRY_RUN -eq 'true')

      - name: Promote or hold dashboard
        if: ${{ !cancelled() && steps.rules.outcome == 'success' && steps.login.outcome == 'success' && steps.fetch.outcome == 'success' && (env.DEPLOYABLE == 'all' || env.DEPLOYABLE == 'dashboard') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./scripts/auto-promote/ui-auto-promote.ps1 -Deployable dashboard -StatePath "$env:RUNNER_TEMP/ui-auto-promote.json" -RunUrl $run -DryRun:($env:DRY_RUN -eq 'true')

      - name: Promote or hold system
        if: ${{ !cancelled() && steps.rules.outcome == 'success' && steps.login.outcome == 'success' && steps.fetch.outcome == 'success' && (env.DEPLOYABLE == 'all' || env.DEPLOYABLE == 'system') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./scripts/auto-promote/ui-auto-promote.ps1 -Deployable system -StatePath "$env:RUNNER_TEMP/ui-auto-promote.json" -RunUrl $run -DryRun:($env:DRY_RUN -eq 'true')

      - name: Promote or hold fworker
        if: ${{ !cancelled() && steps.rules.outcome == 'success' && steps.login.outcome == 'success' && steps.fetch.outcome == 'success' && (env.DEPLOYABLE == 'all' || env.DEPLOYABLE == 'fworker') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./scripts/auto-promote/ui-auto-promote.ps1 -Deployable fworker -StatePath "$env:RUNNER_TEMP/ui-auto-promote.json" -RunUrl $run -DryRun:($env:DRY_RUN -eq 'true')

      - name: Keep the health reads for the next job
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-auto-promote-state
          path: ${{ runner.temp }}/ui-auto-promote.json
          if-no-files-found: ignore

  publish:
    # Its own job: the step that runs PowerShell has no write token for the repository.
    needs: promote
    # The DRY_RUN expression of the workflow's env (a job's if cannot read env).
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run || github.event_name == 'repository_dispatch' && (github.event.client_payload.dry_run == true || github.event.client_payload.dry_run == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ui-auto-promote-state
          path: ${{ runner.temp }}/new
        continue-on-error: true

      - name: Publish the health reads
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          new="$RUNNER_TEMP/new/ui-auto-promote.json"
          if [ ! -f "$new" ]; then echo "No state file was written: nothing to publish."; exit 0; fi
          old="$RUNNER_TEMP/old.json"; echo '{}' > "$old"
          if [ -n "$(git ls-remote --heads origin auto-promote)" ]; then
            git fetch --quiet --depth=1 origin auto-promote
            git show FETCH_HEAD:ui-auto-promote.json > "$old" 2>/dev/null || echo '{}' > "$old"
          fi
          if [ "$(jq -S . "$new")" = "$(jq -S . "$old")" ]; then echo "The health reads are unchanged."; exit 0; fi
          blob=$(git hash-object -w "$new")
          tree=$(printf '100644 blob %s\tui-auto-promote.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Health reads of $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --quiet --force origin "$commit:refs/heads/auto-promote"
