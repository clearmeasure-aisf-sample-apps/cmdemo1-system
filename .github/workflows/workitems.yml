# Work items for the dashboard: scripts/workitems/write-workitems.ps1 reads every issue of the business repository
# (cmdemo1-workorders), tags each bot or team, and writes workitems.json:
# each item's column on the board (project 679) and when it entered each, its agent and Cursor sessions, its pull
# requests, the release that first carries its change and the environments that run it; and the stats of the flow
# (WIP, cycle and lead time, merged and deployed per week, rework, cost). docs/ops/workitems.md is the file's contract.
# It is published on branch "status" next to delivery.json, which the dashboard reads from the browser at
# https://raw.githubusercontent.com/<org>/<repository>/status/workitems.json (the repository is public).
# When: no timer. After every run of workflow "delivery" that a deployment started (a pin of versions.json) or a
# person started, so the environments follow each deployment once delivery.json says what runs where; its hourly
# runs start this one too, which skips at once. On repository_dispatch "workitems", for an event of another
# repository (a board move, a merge: docs/ops/workitems.md says what would send it), and on demand.
# Credentials, for project 679 (node PVT_kwDOD_ESUc4BliGL), in this order, and no new secret: the Actions secret
# GH_PROJECT_TOKEN when this repository has one; else the system's own GitHub App (system.json github.app; key
# SYSTEM_APP_PRIVATE_KEY in environment "capabilities") for a token with Organization projects: read only. An App
# that may not read the organization's projects gets no token. Either way a token that cannot read the project does
# not fail the run: columns are derived from cm-ai-ops-bot's journal comments, and "missing" names the source that
# failed and the secret that would read the board. This workflow's token pushes the branch.
name: workitems

on:
  workflow_run:
    workflows: [delivery]
    types: [completed]
  repository_dispatch:
    types: [workitems]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workitems
  cancel-in-progress: false

jobs:
  workitems:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'schedule'
    runs-on: ubuntu-24.04
    environment: capabilities
    timeout-minutes: 20
    steps:
      # The whole history: the pins of environments/<env>/versions.json say when each release reached each
      # environment.
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: Test the parsing rules
        shell: pwsh
        run: ./scripts/workitems/test-write-workitems.ps1

      - name: Which GitHub App
        id: identity
        run: echo "client-id=$(jq -r '.github.app.clientId // empty' system.json)" >> "$GITHUB_OUTPUT"

      # Organization projects: read and nothing else; the business repository is public and needs no permission.
      - name: Token of the system's App, to read the board
        id: app
        if: steps.identity.outputs.client-id != ''
        continue-on-error: true
        # By commit, not by tag: the action is handed a private key. The commit is the one tag v3.2.0 names.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ steps.identity.outputs.client-id }}
          private-key: ${{ secrets.SYSTEM_APP_PRIVATE_KEY }}
          permission-organization-projects: read

      - name: Fetch the published delivery.json
        env:
          TARGET: ${{ runner.temp }}/delivery.json
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --heads origin status)" ]; then
            git fetch --quiet origin status
            if git cat-file -e FETCH_HEAD:delivery.json 2>/dev/null; then git show FETCH_HEAD:delivery.json > "$TARGET"; fi
          fi

      # GH_PROJECT_TOKEN first, when the repository has it; else the App; else this workflow's token, which reads the
      # public repository and not the private project. The secret's value is never printed.
      - name: Choose the token that reads the board
        id: board
        env:
          PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "$PROJECT_TOKEN" ]; then echo "source=GH_PROJECT_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "$APP_TOKEN" ]; then echo "source=the cmdemo1-system App" >> "$GITHUB_OUTPUT"
          else echo "source=this workflow's token" >> "$GITHUB_OUTPUT"; fi

      - name: Write workitems.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN || steps.app.outputs.token || github.token }}
          BOARD_TOKEN_SOURCE: ${{ steps.board.outputs.source }}
        run: ./scripts/workitems/write-workitems.ps1 -Path "${{ runner.temp }}/workitems.json" -DeliveryPath "${{ runner.temp }}/delivery.json"

      # One commit without a parent: the other files of the branch as published, and this workitems.json, as
      # github-actions[bot] with the token the checkout step kept. Nothing is pushed when the file says what the
      # published one says, the time of generation aside. Workflow "delivery" replaces the branch too (and keeps this
      # file as published): the push is refused when the branch moved since it was read, and is made again on top.
      - name: Publish on branch status
        env:
          WRITTEN: ${{ runner.temp }}/workitems.json
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          facts() { jq --sort-keys 'del(.generatedAt)'; }
          for attempt in 1 2 3 4; do
            base=""
            others=""
            if [ -n "$(git ls-remote --heads origin status)" ]; then
              git fetch --quiet origin status
              base=$(git rev-parse FETCH_HEAD)
              if git cat-file -e FETCH_HEAD:workitems.json 2>/dev/null \
                && [ "$(facts < "$WRITTEN")" = "$(git show FETCH_HEAD:workitems.json | facts 2>/dev/null || true)" ]; then
                echo "workitems.json is unchanged: nothing to publish."
                exit 0
              fi
              others=$(git ls-tree FETCH_HEAD | grep -v $'\tworkitems.json$' || true)
            fi
            blob=$(git hash-object -w "$WRITTEN")
            tree=$( { [ -n "$others" ] && printf '%s\n' "$others"; printf '100644 blob %s\tworkitems.json\n' "$blob"; } | git mktree)
            commit=$(git commit-tree "$tree" -m "Work items of $(date -u +%Y-%m-%dT%H:%M:%SZ)")
            if git push --quiet --force-with-lease="refs/heads/status:$base" origin "$commit:refs/heads/status"; then
              echo "Published on branch status ($commit)."
              exit 0
            fi
            echo "Branch status moved while this run read it (attempt $attempt of 4): reading it again."
            sleep $((attempt * 10))
          done
          echo "Branch status kept moving: workitems.json was not published."
          exit 1
